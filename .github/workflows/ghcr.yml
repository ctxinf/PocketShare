name: Container
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/ctxinf/pocketshare
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          load: true
          push: false
          tags: pocketshare:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run -d --name pocketshare-ci pocketshare:ci
          trap 'docker logs pocketshare-ci; docker rm -fv pocketshare-ci' EXIT
          for attempt in $(seq 1 30); do
            if docker exec pocketshare-ci curl -fsS http://127.0.0.1:3000/health; then break; fi
            sleep 1
          done
          docker exec pocketshare-ci sh -ec '
            curl -fsS http://127.0.0.1:3000/health
            export XDG_CONFIG_HOME=/tmp/pshare-ci
            pshare login "$(cat /data/api_key)"
            key=$(pshare put "container smoke test")
            test "$(pshare get "$key")" = "container smoke test"
            pshare delete "$key"
          '
      - uses: docker/build-push-action@v6
        if: github.event_name != 'pull_request'
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
