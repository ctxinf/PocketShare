services:
  pocketshare:
    image: ghcr.io/ctxinf/pocketshare:latest
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./config.toml:/etc/pocketshare/config.toml:ro
      - pocketshare-data:/data
    restart: unless-stopped
volumes:
  pocketshare-data:
